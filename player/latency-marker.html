<!DOCTYPE html>
<!--
Latency marker: draws the time of the screen's frames as a barcode, for the
Android app's screen-to-screen measurement. Open it in a browser window
anywhere on the captured screen; the app finds the barcode in the picture,
reads the time and compares it with the true time (NTP) the frame reached the
phone's screen. The time is this PC's clock, so keep it synced
(timedatectl timesync-status).

The time is counted in slots of 1/60 s, the capture's frame interval, and
written in Gray code: from one slot to the next exactly one cell changes in
each data row, so the video encoder keeps the code sharp, and a frame caught
while a cell changes reads as one of the two neighbouring slots. The code
changes at the first frame of each slot; the reader takes the slot's start as
the frame's time (0..1 frame of the PC's screen early).

Code: square cells on a white quiet zone of 2 cells, 58 x 7 cells; x, y are
cells from its top left corner (MarkerReader.kt has the same layout):
  finders: 7x7 squares as in a QR code (black ring, white ring, black 3x3
         core; 1:1:3:1:1 across the middle) at x 0..6 and x 51..57; the
         reader looks for them anywhere in the picture
  y 1:   the grid, 42 cells at x 8..49 alternating black, white, ...; the
         reader takes the levels of black and white from it
  y 3:   32 cells of data at x 8..39, black = 1, most significant bit first:
         the low 32 bits of the slot number (unix time in ms * 60 / 1000,
         rounded down) in Gray code
  y 5:   the same as y 3; the reader takes the code only when both agree
-->
<html>
<head>
<meta charset="utf-8">
<title>stream latency marker</title>
<style>
  html, body { margin: 0; background: #fff; overflow: hidden; }
  canvas { display: block; }
  #text { font: 20px monospace; padding: 4px 16px; color: #000; }
</style>
</head>
<body>
<canvas id="marker"></canvas>
<div id="text"></div>
<script>
const CELL = 16;       // CSS px; about 12 px in a 1920-wide stream of a 2560 screen
const CELLS = 42;
const QUIET = 2;       // cells of white around the code
const WIDTH = 58, HEIGHT = 7; // the code, cells
const FINDERS = [0, 51]; // left edges of the finders
const CODE_X = 8, GRID_Y = 1, DATA_Y = [3, 5];
const DATA_BITS = 32;
// the capture's frame interval; latency-marker.html?hz=1 slows the code down to
// look at it, but the app reads only the 60 Hz code
const SLOT_MS = 1000 / (Number(new URLSearchParams(location.search).get("hz")) || 60);
const canvas = document.getElementById("marker");
const text = document.getElementById("text");
const ctx = canvas.getContext("2d");
let lastSlot = -1;

function resize() {
  const ratio = window.devicePixelRatio || 1;
  const w = (WIDTH + 2 * QUIET) * CELL, h = (HEIGHT + 2 * QUIET) * CELL;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * ratio);
  canvas.height = Math.round(h * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  lastSlot = -1; // resizing clears the canvas: draw again
}

// The cells of a data row for slot: Gray code of its low 32 bits, MSB first.
function bits(slot) {
  const low = slot % 4294967296; // 2^32
  const gray = (low ^ (low >>> 1)) >>> 0;
  const out = [];
  for (let i = DATA_BITS - 1; i >= 0; i--) out.push((gray >>> i) & 1);
  return out;
}

function drawCode(slot) {
  const w = (WIDTH + 2 * QUIET) * CELL, h = (HEIGHT + 2 * QUIET) * CELL;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#000";
  const x0 = QUIET * CELL, y0 = QUIET * CELL;
  for (const fx of FINDERS) {
    const x = x0 + fx * CELL;
    ctx.fillStyle = "#000"; ctx.fillRect(x, y0, 7 * CELL, 7 * CELL);
    ctx.fillStyle = "#fff"; ctx.fillRect(x + CELL, y0 + CELL, 5 * CELL, 5 * CELL);
    ctx.fillStyle = "#000"; ctx.fillRect(x + 2 * CELL, y0 + 2 * CELL, 3 * CELL, 3 * CELL);
  }
  const cx = x0 + CODE_X * CELL;
  for (let i = 0; i < CELLS; i += 2) ctx.fillRect(cx + i * CELL, y0 + GRID_Y * CELL, CELL, CELL);
  const data = bits(slot);
  for (const row of DATA_Y)
    for (let i = 0; i < DATA_BITS; i++) if (data[i]) ctx.fillRect(cx + i * CELL, y0 + row * CELL, CELL, CELL);
}

function draw(frameTime) {
  // the frame's time: rAF gives when this frame started, on the page's clock
  const ms = performance.timeOrigin + frameTime;
  const slot = Math.floor(ms / SLOT_MS);
  if (slot !== lastSlot) {
    lastSlot = slot;
    drawCode(slot);
    // the text changes 4 times a second, not to keep the encoder busy
    if (slot % 15 === 0 || SLOT_MS > 250) text.textContent = new Date(ms).toISOString().slice(11, 23);
  }
  requestAnimationFrame(draw);
}

resize();
window.addEventListener("resize", resize);
requestAnimationFrame(draw);
</script>
</body>
</html>
