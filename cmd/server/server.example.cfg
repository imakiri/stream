# Stream server (source): OBS -> this -> proxy -> clients.
# Keys live next to the binary (ca.key, server.key, server.cert), made on the first start.

[proxy]
  addr = "127.0.0.1"
  port = 25565
  network = "udp"      # "udp" or "tcp"
  socks_proxy = ""     # tcp only, e.g. "socks5://127.0.0.1:2080"

# local UDP port OBS sends the mpegts stream to, e.g. udp://127.0.0.1:2557?pkt_size=1316
[stream_input]
  port = 2557

# must match the clients
[fec]
  data_parts = 8
  total_parts = 10

[encoder]
  dispatcher_size = 4      # chunks interleaved together
  dispatcher_timeout = 10  # ms without input before a partial chunk is sent
