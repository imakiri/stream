# Stream server (source): OBS -> this -> relay -> clients.
# Keys live next to the binary (ca.key, server.key, server.cert), made on the first start.

[relay]
  addr = "127.0.0.1"
  port = 25565
  network = "udp"      # "udp" or "tcp"

# Optional: reach the relay through a proxy, one of these at most.
# A SOCKS5 proxy such as a local sing-box; tcp, or udp if it has UDP ASSOCIATE:
#[proxy.socks5]
#  url = "socks5://127.0.0.1:2080"
# An HTTP CONNECT proxy; tcp only:
#[proxy.http]
#  url = "http://127.0.0.1:8080"
# An AmneziaWG tunnel inside this program, udp or tcp, no system VPN needed;
# the config as the Amnezia app exports it, the path relative to this file:
#[proxy.amneziawg]
#  config = "amneziawg.conf"

# local UDP port OBS sends the mpegts stream to, e.g. udp://127.0.0.1:2557?pkt_size=1316
[stream_input]
  port = 2557

# FEC: the stream is cut into chunks of up to chunk_packets packets (1318
# bytes of stream each); the data packets of a chunk go out as soon as it is
# closed, and Reed-Solomon parity over each block of block_chunks chunks goes
# after them: parity_percent parity packets per 100 data packets. A block
# survives that many lost packets anywhere in it; a chunk without losses
# plays at once, one with losses waits for its block. Clients read the
# layout from the packets.
[fec]
  chunk_packets = 6
  block_chunks = 4
  parity_percent = 33

[encoder]
  chunk_max_age = 10       # ms after its first byte a partial chunk is sent

# a chunk's packets go out back to back, and a key frame is several chunks;
# a shaper on the way cuts off the tail of such a burst. Spread them at this
# rate, a few times the stream's wire rate (5.5 Mbit/s of video take ~8.5
# with the FEC above). 0 turns pacing off.
[pacing]
  rate_mbit = 30

# Optional: the true time from an NTP server for the end-to-end delay in the
# log and the client reports; server and clients should ask the same one.
# Off by default: the client estimates the server clock at the handshake,
# off by up to half the round trip through the relay. One of:
#[clock]
#  ntp_server = "time.cloudflare.com"   # anycast, nearest site
#  ntp_server = "time.google.com"       # stratum 1; smears leap seconds
#  ntp_server = "pool.ntp.org"
#  ntp_server = "time.windows.com"
