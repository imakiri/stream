# Stream client (viewer): relay -> this -> local player.
# Keys live next to the binary (client.key, client.enrollment), see cmd/client.

[relay]
  addr = "127.0.0.1"
  port = 25565
  network = "udp"      # "udp" or "tcp"

# Optional: reach the relay through a proxy, one of these at most.
# A SOCKS5 proxy such as a local sing-box; tcp only:
#[proxy.socks5]
#  url = "socks5://127.0.0.1:2080"
# An AmneziaWG tunnel inside this program, udp or tcp, no system VPN needed;
# the config as the Amnezia app exports it, the path relative to this file:
#[proxy.amneziawg]
#  config = "amneziawg.conf"

# ffplay -f mpegts -fflags nobuffer -flags low_delay -framedrop -sync ext "udp://127.0.0.1:25566?overrun_nonfatal=1"
[player]
  port = 25566

# must match the server
[fec]
  data_parts = 8
  total_parts = 10

[decoder]
  assembler_size = 6
  dispatcher_size = 12
